---
apiVersion: v1
kind: Namespace
metadata:
  name: haproxy-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haproxy-operator
  namespace: haproxy-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haproxy-operator-role
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haproxy-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haproxy-operator-role
subjects:
- kind: ServiceAccount
  name: haproxy-operator
  namespace: haproxy-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-operator
  namespace: haproxy-operator-system
  labels:
    app.kubernetes.io/name: haproxy-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy-operator
    spec:
      serviceAccountName: haproxy-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: haproxy-operator:latest
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect
        - --namespace=default
        - --configmap-key=config.yaml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-operator-metrics
  namespace: haproxy-operator-system
  labels:
    app.kubernetes.io/name: haproxy-operator
spec:
  selector:
    app.kubernetes.io/name: haproxy-operator
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
